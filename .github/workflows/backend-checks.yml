name: Backend checks

# Backend lint and tests only. No app publishing, secret values, or database access.

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: python -m pip install --no-cache-dir -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: python -m ruff check . --no-cache

      - name: Pytest
        working-directory: backend
        run: python -m pytest -p no:cacheprovider
